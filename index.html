<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070b1f">
<title>财大校园卡</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#070b1f; --card:rgba(255,255,255,.055); --line:rgba(255,255,255,.1);
  --text:#e8ecf8; --muted:#8b95bd; --dim:#5a6494;
  --cyan:#38bdf8; --violet:#a78bfa; --pink:#f472b6; --green:#4ade80; --amber:#fbbf24;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);overflow-x:hidden;
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  line-height:1.6;padding-bottom:env(safe-area-inset-bottom);
}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(110px);z-index:0;pointer-events:none}
body::before{width:420px;height:420px;top:-140px;left:-120px;background:radial-gradient(circle,#1d4ed8aa,transparent 70%);animation:f1 18s ease-in-out infinite}
body::after{width:400px;height:400px;bottom:-160px;right:-130px;background:radial-gradient(circle,#9333ea99,transparent 70%);animation:f2 22s ease-in-out infinite}
@keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,50px)}}
@keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-40px)}}

.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 18px 40px}

/* ── 顶部 ── */
.top{display:flex;align-items:center;gap:10px;padding:18px 0 14px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--violet));
  display:grid;place-items:center;font-weight:800;font-size:15px;color:#070b1f;flex:0 0 auto}
.top h1{font-size:16px;font-weight:700;flex:1;min-width:0}
.top h1 small{display:block;font-size:11px;color:var(--dim);font-weight:400;letter-spacing:1px}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--muted);font-size:15px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.iconbtn:active{transform:scale(.94)}

/* ── 卡片通用 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* ── 登录 ── */
.login{padding:26px 22px;margin-top:8px}
.login h2{font-size:19px;margin-bottom:6px}
.login p{font-size:13px;color:var(--muted);margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
.field input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:11px;
  padding:13px 14px;color:var(--text);font-size:15px;font-family:inherit;outline:none}
.field input:focus{border-color:rgba(56,189,248,.55)}
.btn{width:100%;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;
  padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--cyan),var(--violet));
  color:#070b1f;transition:.2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.tip{font-size:12px;color:var(--dim);margin-top:14px;line-height:1.7}
.tip b{color:var(--muted)}

/* ── 登录方式切换 ── */
.seg{display:flex;gap:4px;background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:11px;padding:4px;margin-bottom:16px}
.seg-btn{flex:1;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:9px 6px;
  border:none;border-radius:8px;background:transparent;color:var(--dim);transition:.2s;white-space:nowrap}
.seg-btn.on{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#070b1f}
.pw-hint{font-size:11.5px;color:var(--dim);line-height:1.6;margin-top:8px;
  padding:9px 11px;background:rgba(56,189,248,.07);border-left:2px solid rgba(56,189,248,.4);border-radius:0 8px 8px 0}
.pw-hint b{color:var(--muted)}

/* ── 余额 ── */
.balance{padding:28px 24px 24px;text-align:center;position:relative;overflow:hidden}
.balance::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;
  top:-130px;right:-80px;background:radial-gradient(circle,rgba(245,158,11,.14),transparent 68%)}
.balance .label{font-size:12.5px;color:var(--muted);letter-spacing:2px}
.balance .amt{font-family:"SF Mono",Consolas,monospace;font-size:46px;font-weight:700;line-height:1.15;
  margin:8px 0 4px;letter-spacing:-1.5px}
.balance .amt small{font-size:22px;opacity:.6;margin-right:2px}
.balance .hint{font-size:12px;color:var(--dim)}
.balance .hint.warn{color:var(--amber)}
.balance .hint.late{color:#fb7185}

/* ── 付款码大按钮 ── */
.paybtn{display:block;width:100%;margin-top:14px;padding:18px;border-radius:16px;border:1px solid rgba(245,158,11,.35);
  background:linear-gradient(135deg,rgba(245,158,11,.18),rgba(245,158,11,.07));
  color:var(--amber);font-size:16px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:9px;transition:.2s}
.paybtn:active{transform:scale(.985)}
.paybtn .qr{width:20px;height:20px;border:2px solid currentColor;border-radius:4px;position:relative}
.paybtn .qr::before{content:"";position:absolute;inset:3px;border:2px solid currentColor;border-radius:2px;opacity:.55}

/* ── 最近消费 ── */
.sec{margin-top:22px}
.sec h3{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:10px;display:flex;
  justify-content:space-between;align-items:center;letter-spacing:.5px}
.sec h3 a{font-size:12px;color:var(--cyan);text-decoration:none;font-weight:400}
.item{display:flex;align-items:center;gap:12px;padding:13px 16px;margin-bottom:7px}
.item .ic{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.06);flex:0 0 auto;
  display:grid;place-items:center;font-size:15px}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mid span{font-size:11.5px;color:var(--dim)}
.item .amt2{font-family:"SF Mono",Consolas,monospace;font-size:15px;font-weight:600;flex:0 0 auto}
.item .amt2.minus{color:#fb7185}

/* ── 本月统计 ── */
.stats{padding:18px 20px}
.stats .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.stats .row .k{font-size:12.5px;color:var(--muted)}
.stats .row .v{font-family:"SF Mono",Consolas,monospace;font-size:19px;font-weight:700}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--violet));width:0;transition:width .8s cubic-bezier(.22,.8,.3,1)}

/* ── 状态 ── */
.empty{text-align:center;padding:26px 16px;color:var(--dim);font-size:13px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:rgba(12,17,34,.96);border:1px solid var(--line);border-radius:12px;padding:11px 18px;
  font-size:13.5px;opacity:0;pointer-events:none;transition:.3s;z-index:99;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.25);
  border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="logo">财</div>
    <h1>财大校园卡<small>HENAN UNIVERSITY OF ECONOMICS &amp; LAW</small></h1>
    <button class="iconbtn" id="refreshBtn" title="刷新">⟳</button>
  </div>

  <!-- 登录 -->
  <div class="card login" id="loginView">
    <h2>绑定你的校园卡</h2>
    <p>学号 + 查询密码（初始为身份证后 6 位）</p>
    <div class="field">
      <label>学号 / 身份证号</label>
      <div class="seg" id="loginType">
      <button class="seg-btn on" data-type="sno">学号登录</button>
      <button class="seg-btn" data-type="id">身份证登录</button>
    </div>
    <input id="userInput" type="text" inputmode="numeric" autocomplete="username" placeholder="请输入学号">
    </div>
    <div class="field">
      <label>查询密码</label>
      <input id="passInput" type="password" autocomplete="current-password" placeholder="查询密码（初始为身份证后 6 位）">
    <div class="pw-hint">这里要的是<b>查询密码</b>（不是消费密码）。初始是身份证后 6 位；末位为 <b>X</b> 的取 X 前 6 位数字。若你在公众号里改过密码，请用改后的那个。</div>
    </div>
    <button class="btn" id="loginBtn">绑定</button>
    <div class="tip">
      <b>🔒 安全说明</b><br>
      密码只保存在你自己的手机和服务器内存里，不上传、不进代码、不进仓库。<br>
      这个工具只供你自己使用。
    </div>
  </div>

  <!-- 主界面 -->
  <div id="mainView" class="hidden">
    <div class="card balance">
      <div class="label">卡 余 额</div>
      <div class="amt"><small>¥</small><span id="balance">--.--</span></div>
      <div class="hint" id="syncHint">正在同步…</div>
    </div>

    <a class="paybtn" id="payBtn" target="_blank" rel="noopener">
      <span class="qr"></span> 出示付款码
    </a>

    <div class="sec">
      <h3><span>最近消费</span><a id="allBill" href="#">全部账单 ›</a></h3>
      <div id="recentList"></div>
    </div>

    <div class="sec">
      <h3><span>本月消费</span></h3>
      <div class="card stats">
        <div class="row">
          <span class="k">本月合计</span>
          <span class="v" id="monthAmt">¥0.00</span>
        </div>
        <div class="bar"><i id="monthBar"></i></div>
        <div class="row" style="margin:12px 0 0">
          <span class="k">日均</span>
          <span class="k" id="dayAvg">¥0.00</span>
        </div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
